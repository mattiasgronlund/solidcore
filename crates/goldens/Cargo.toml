[package]
name = "goldens"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false
description = "Checks every unit's cases against its committed expected output (goldens)."
build = "build.rs"

[dependencies]
# EXPERIMENT: inari main; the ca6faf9 build edits this rev (see experiments/inari-cr-macos-ed65e20/README.md).
inari = { git = "https://github.com/mattiasgronlund/inari", rev = "6a9fa7aad2a3ed0551e01239dac94ae149773d1c", optional = true }
solidcore = { path = "../solidcore" }
# The `ssi` engine of --ssi-corpus (a surface/surface intersection of its own, not a port).
ssi = { path = "../ssi" }
# The `solidcore-ssi` engine of --ssi-corpus (`ssi` behind the port's inputs and output).
solidcore-ssi = { path = "../solidcore-ssi" }
# The STEP reader of --step-corpus: the record's Part 21 parser and neutral model, and step-export's
# mapper from one to the other.
solidcore-record = { path = "../solidcore-record" }
step-export = { path = "../step-export" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse decimals exactly (correctly rounded, as C strtod), not to within 1 ULP
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"

[features]
# EXPERIMENT: route the binary's libm calls to inari::cr (src/cr_interpose.rs).
cr = ["dep:inari"]
# ... and record the arguments of every 10,000th acos call.
acos-args = ["cr"]
# EXPERIMENT: Ivl through inari::Interval, and Ivl operation counts.
ivl-count = ["solidcore/ivl-count"]
ivl-inari = ["solidcore/ivl-inari"]
ivl-inari-generic = ["solidcore/ivl-inari-generic"]
