[package]
name = "cr-eval"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# fushimi 0.1.0 from crates.io (built from e241d34b), under inari's old name, so `inari::cr`
# resolves as at the other commits.
inari = { package = "fushimi", version = "=0.1.0", default-features = false }
rug = { version = "1.19", default-features = false, features = ["float"] }
# The libm solidcore's `math::det` calls (tangency-labs/solidcraft#15405), pinned as there.
libm = "=0.2.16"

[features]
force-generic = ["inari/force-generic"]

[profile.release]
lto = "fat"
codegen-units = 1
