[package]
name = "cr-eval"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# inari ca6faf9, the commit of the first macOS run.
inari = { git = "https://github.com/mattiasgronlund/inari", rev = "ca6faf9c109ad62a7e53afc598d59f74af92adeb", default-features = false }
rug = { version = "1.19", default-features = false, features = ["float"] }
# The libm solidcore's `math::det` calls (tangency-labs/solidcraft#15405), pinned as there.
libm = "=0.2.16"

[features]
force-generic = ["inari/force-generic"]

[profile.release]
lto = "fat"
codegen-units = 1
